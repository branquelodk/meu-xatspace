<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090713" />
    <meta name="description" content="Fundo noturno anime para xatspace." />
    <title>Fundo noturno — xatspace</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #090713;
      }
      body {
        background-image:
          linear-gradient(180deg, rgba(8, 7, 20, 0.16), rgba(8, 7, 20, 0.42)),
          radial-gradient(
            ellipse at 76% 18%,
            rgba(185, 145, 255, 0.14),
            transparent 34%
          ),
          url("./assets/xatspace-night-sky-male.webp");
        background-position:
          center,
          center,
          center 42%;
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
      }
      body::after {
        position: fixed;
        inset: 0;
        content: "";
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 46%,
          rgba(5, 5, 15, 0.3) 100%
        );
      }
      @media (max-width: 700px) {
        body {
          background-position:
            center,
            center,
            62% center;
        }
      }
    </style>
  </head>
  <body aria-label="Céu noturno com personagem anime e cidade iluminada"></body>
</html>
